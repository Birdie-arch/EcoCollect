<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Profile — EcoCollect Collector</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="sidebar-brand">
          <div class="nav-logo-icon" style="background: var(--color-accent-lavender);"><i class="fas fa-truck-pickup"></i></div>
          <div>
            <h3>EcoCollect</h3>
            <span class="tag" style="background: var(--color-accent-lavender-soft); color: var(--color-accent-lavender);">FIELD OPERATOR</span>
          </div>
        </a>
      </div>

      <ul class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
        </li>
        <li class="sidebar-nav-item">
          <a href="requests.html"><i class="fas fa-clipboard-list"></i> <span>Assigned Pickups</span></a>
        </li>
        <li class="sidebar-nav-item">
          <a href="pickup.html"><i class="fas fa-truck"></i> <span>Active Field Run</span></a>
        </li>
        <li class="sidebar-nav-item">
          <a href="profile.html" class="active"><i class="fas fa-id-card"></i> <span>Fleet Profile</span></a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Sign Out
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="menu-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
          </button>
          <div class="page-title">
            <h1>Collector Fleet Profile</h1>
            <p>Manage your operational vehicle, licensed streams, and designated municipal zone.</p>
          </div>
        </div>
      </div>

      <div class="card" style="max-width: 680px; margin: 0 auto;">
        <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1.5px solid var(--border-subtle);">
          <div style="width: 76px; height: 76px; border-radius: 50%; background: var(--color-accent-lavender-soft); color: var(--color-accent-lavender); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; border: 2px solid var(--color-primary);" id="col-avatar-letter">
            C
          </div>
          <div>
            <h3 style="margin: 0 0 4px;" id="col-header-name">Fleet Operator</h3>
            <span class="badge badge-lavender">CERTIFIED OPERATOR</span>
            <span style="font-size: 0.85rem; color: #F59E0B; font-weight: 700; margin-left: 0.5rem;" id="col-header-rating">★ 5.0</span>
          </div>
        </div>

        <form id="collector-profile-form">
          <div class="form-group">
            <label class="form-label" for="col-name">Operator Name</label>
            <input type="text" id="col-name" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="col-email">Email Address</label>
            <input type="email" id="col-email" class="form-control" disabled style="background: var(--bg-surface-warm); cursor: not-allowed;">
          </div>

          <div class="form-group">
            <label class="form-label" for="col-phone">Contact Phone Number</label>
            <input type="tel" id="col-phone" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="col-vehicle">Assigned Fleet Vehicle</label>
            <input type="text" id="col-vehicle" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="col-zone">Primary Metropolitan Operating Zone</label>
            <select id="col-zone" class="form-select">
              <option value="Central Zone">Central Zone</option>
              <option value="East Zone">East Zone</option>
              <option value="South Zone">South Zone</option>
              <option value="North Zone">North Zone</option>
              <option value="West Zone">West Zone</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <i class="fas fa-save"></i> Update Fleet Credentials
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/collector.js"></script>
</body>
</html>
