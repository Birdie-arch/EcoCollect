<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Pickups — EcoCollect Collector</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="sidebar-brand">
          <div class="nav-logo-icon" style="background: var(--color-accent-lavender);"><i class="fas fa-truck-pickup"></i></div>
          <div>
            <h3>EcoCollect</h3>
            <span class="tag" style="background: var(--color-accent-lavender-soft); color: var(--color-accent-lavender);">FIELD OPERATOR</span>
          </div>
        </a>
      </div>

      <ul class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
        </li>
        <li class="sidebar-nav-item">
          <a href="requests.html" class="active"><i class="fas fa-clipboard-list"></i> <span>Assigned Pickups</span></a>
        </li>
        <li class="sidebar-nav-item">
          <a href="pickup.html"><i class="fas fa-truck"></i> <span>Active Field Run</span></a>
        </li>
        <li class="sidebar-nav-item">
          <a href="profile.html"><i class="fas fa-id-card"></i> <span>Fleet Profile</span></a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block btn-sm" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Sign Out
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="menu-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
          </button>
          <div class="page-title">
            <h1>Assigned Pickup Schedule</h1>
            <p>Review customer contact information, route instructions, and completion status.</p>
          </div>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="table-toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="collector-search-input" class="form-control" placeholder="Search by ID, customer name, address...">
        </div>

        <div class="filter-group">
          <select id="collector-status-filter" class="filter-select">
            <option value="ALL">All Assignments</option>
            <option value="ASSIGNED">Assigned (New)</option>
            <option value="ACCEPTED">Accepted</option>
            <option value="ON_THE_WAY">On The Way</option>
            <option value="ARRIVED">Arrived</option>
            <option value="COLLECTED">Collected</option>
            <option value="COMPLETED">Completed</option>
          </select>
        </div>
      </div>

      <!-- Requests Table -->
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Request ID</th>
              <th>Citizen Contact</th>
              <th>Hardware Item</th>
              <th>Doorstep Address</th>
              <th>Scheduled Slot</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="collector-requests-table-body">
            <!-- Injected by collector.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/collector.js"></script>
</body>
</html>
